<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO & Social -->
    <meta name="description" content="بگویار - پلتفرم پیام‌رسانی ناشناس" />
    <meta name="theme-color" content="#c78a53" />
    <meta property="og:title" content="بگویار" />
    <meta
      property="og:description"
      content="پیام‌های ناشناس خود را به اشتراک بگذارید"
    />
    <meta property="og:type" content="website" />
    <meta property="twitter:card" content="summary" />
    <meta property="language" content="Persian" />

    <title>بگویار</title>
    <link rel="stylesheet" href="style.css" />
    <link
      id="favicon"
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e17055'/%3E%3Cpath d='M6 8h12M6 12h8M6 16h10' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body dir="rtl">
    <!-- App Layout -->
    <div class="app-layout">
      <!-- Sidebar (Left = Post Box + Footer) -->
      <aside class="sidebar">
        <div class="sidebar-inner">
          <!-- Sidebar Header -->
          <header class="sidebar-header">
            <div class="logo">
              <h1>بگویار</h1>
            </div>
            <button id="themeToggle" class="control-btn" title="Toggle theme">
              <span></span>
            </button>
          </header>

          <!-- Post Box -->
          <article class="post-box" id="postBox">
            <div class="post-header">
              <h2>ناشناس حرفت رو بزن</h2>
              <div class="char-count">
                <span id="charCount">0/1000</span>
              </div>
            </div>
            <textarea
              id="messageInput"
              placeholder="یه پیام بنویس..."
              maxlength="1000"
              rows="4"
            ></textarea>
            <div class="post-footer">
              <input
                type="text"
                id="authorInput"
                placeholder="نام تو (اختیاری)"
                maxlength="50"
              />
              <button id="sendBtn" class="send-btn">فرستادن</button>
            </div>
            <div id="postError" class="error-message"></div>
          </article>

          <!-- Sidebar Footer -->
          <footer class="footer">
            <p>&copy; 2026 تمامی حقوق بگویار محفوظ می‌باشد.</p>
          </footer>
        </div>
      </aside>

      <!-- Main (Feed) -->
      <main class="main-content">
        <!-- Feed -->
        <section class="feed-container">
          <div class="feed-header">
            <div class="feed-header-top">
              <h2>پیام ها</h2>
              <div class="feed-info">
                <span id="feedStatus">لودینگ...</span>
                <div class="loading-spinner" id="loadingSpinner"></div>
              </div>
            </div>
            <div class="feed-controls">
              <!-- Search Filter -->
              <input type="text" id="searchInput" placeholder="جستجو..." />
              <button id="searchBtn" class="control-btn">
                <svg class="icon-regular" viewBox="0 0 24 24">
                  <circle cx="10" cy="9" r="8" />
                  <path d="M16 16l4 4" />
                </svg>
              </button>
              <button id="clearSearch" class="control-btn">
                <svg class="icon-regular" viewBox="0 0 24 24">
                  <path d="M6 6l12 12M18 6L6 18" />
                </svg>
              </button>

              <!-- Date Filter -->
              <div>
                <input type="date" id="dateFilter" class="visually-hidden" />
                <button id="dateFilterButton" class="control-btn">
                  <svg class="icon-regular" viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="16" rx="2" />
                    <path d="M3 10h18M8 3v4M16 3v4" />
                  </svg>
                </button>
              </div>
              <button id="clearDate" class="control-btn" style="display: none">
                <svg class="icon-regular" viewBox="0 2 24 24">
                  <path d="M6 6l12 12M18 6L6 18" />
                </svg>
              </button>
            </div>
          </div>
          <div id="feed"></div>
          <nav class="load-more" id="loadMore">
            <button id="loadMoreBtn">پیام های بیشتر</button>
          </nav>
        </section>
      </main>
    </div>

    <!-- Footer -->
    <footer class="footer footer-global">
      <p>&copy; 2026 تمامی حقوق بگویار محفوظ می‌باشد.</p>
    </footer>

    <!-- Toast Notification -->
    <section
      id="toast"
      class="toast"
      aria-live="polite"
      aria-label="اعلان‌ها"
    ></section>

    <!-- Back to Top -->
    <button id="backToTop" class="back-to-top" title="برو بالا">
      <svg class="icon-regular" viewBox="0 0 24 24">
        <path d="M12 19V5" />
        <path d="M5 12l7-7 7 7" />
      </svg>
    </button>

    <script src="app.js"></script>
  </body>
</html>
